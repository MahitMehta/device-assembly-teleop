# Run on coral from this folder, one command at a time, in the foreground (Ctrl-C stops it).
# Settings (IPs, ROS domain, payload) come from .env: cp .example.env .env
# Our own UR driver on our own ROS domain (67), independent of anything else on the arm.
#   docker compose run --rm driver                  # UR driver, starts in forward_position_controller
#   docker compose run --rm teleop                  # second shell: dry-run (sends nothing)
#   docker compose run --rm teleop --live           # extra args go to teleop_node
#   docker compose run --rm record <task_name>      # third shell, while live
#   docker compose run --rm camera                  # on the camera laptop, not coral
#   docker compose run --rm ros <any command>       # e.g. ros2 topic list
#   docker compose run --rm rviz                    # on a machine with a display (xhost +local:root first)
# Nothing starts by itself and nothing restarts: every service is behind the `manual`
# profile, so a bare `docker compose up` does nothing.

x-ros: &ros
  image: quest-teleop:humble
  build: .                         # Dockerfile; built on first use (`docker compose --profile manual build` to rebuild)
  network_mode: host
  init: true                       # pass Ctrl-C through
  working_dir: /teleop
  volumes:
    - .:/teleop
    - /data:/data
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:?set in .env (cp .example.env .env)}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    # Keep DDS on the robot network (coral and the camera laptop), not Tailscale, Docker or Wi-Fi.
    # Ask for socket buffers big enough for whole depth frames; the kernel grants at most
    # net.core.rmem_max (README, Wrist camera), and asking for more than that is harmless.
    CYCLONEDDS_URI: <CycloneDDS><Domain><General><Interfaces><NetworkInterface address="${DDS_IP:?set in .env}"/></Interfaces></General><Internal><SocketReceiveBufferSize min="default" max="16MB"/></Internal></Domain></CycloneDDS>
    PYTHONDONTWRITEBYTECODE: "1"   # no root-owned __pycache__ in the checkout
  profiles: [manual]

services:
  driver:
    <<: *ros
    # Headless: the driver sends its program to the arm itself (pendant in Remote Control),
    # so the pendant's installation is untouched. Only one driver can control the arm.
    entrypoint: [scripts/ros.sh, ros2, launch, ur_robot_driver, ur_control.launch.py,
                 ur_type:=ur5e, "robot_ip:=${ROBOT_IP:?}", "reverse_ip:=${REVERSE_IP:?}",
                 headless_mode:=true, launch_rviz:=false,
                 initial_joint_controller:=forward_position_controller]
    command: []

  teleop:
    <<: *ros
    entrypoint: [scripts/ros.sh, python3, -m, quest_teleop.nodes.teleop_node,
                 --udp-bind, "${CORAL_IP:?}", --udp-from, "${SENDER_IP:?}",
                 --payload-mass, "${PAYLOAD_MASS:?}",
                 --payload-cog, "${PAYLOAD_COG_X:?}", "${PAYLOAD_COG_Y:?}", "${PAYLOAD_COG_Z:?}"]
    command: []

  camera:
    # On the lab laptop the wrist D435 is plugged into, not on coral.
    <<: *ros
    privileged: true               # USB access to the RealSense
    volumes:
      - .:/teleop
      - /dev:/dev
    environment:
      <<: *ros-env
      CAMERA_SERIAL: ${CAMERA_SERIAL:-}   # .env: which RealSense is the wrist camera
    entrypoint: [scripts/ros.sh, scripts/camera.sh]

  rviz:
    # Arm model, TF (with the wrist camera calibration) and the wrist image. Run it on the camera
    # laptop so raw images stay on that machine. The host must allow the container on its
    # display first: xhost +local:root
    <<: *ros
    volumes:
      - .:/teleop
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    entrypoint: [scripts/ros.sh, rviz2, -d, config/teleop.rviz]

  record:
    <<: *ros
    entrypoint: [scripts/ros.sh, scripts/record.sh]

  ros:
    <<: *ros
    entrypoint: [scripts/ros.sh]
    command: [bash]
